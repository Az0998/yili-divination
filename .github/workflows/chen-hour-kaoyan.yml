# GitHub 云端定时，不经过 Cursor Automations。
# 07:30 中国 = 23:30 UTC 9/17；08:20 中国 = 00:20 UTC 9/18。
name: Chen-hour kaoyan fallback

on:
  schedule:
    - cron: "30 23 17 9 *"
    - cron: "20 0 18 9 *"
  workflow_dispatch:
    inputs:
      mode:
        description: ping 只测引擎；kaoyan 正占（非 9月18日会被时门拦住）
        type: choice
        default: ping
        options:
          - ping
          - kaoyan

permissions:
  contents: read
  actions: read

jobs:
  ping:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Engine self-test
        run: |
          node tools/verify-kaoyan.js | tee ping-kaoyan.txt
          node tools/verify-cloud-ready.js | tee ping-cloud-ready.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-ping-20260917
          path: ping-*.txt

  kaoyan:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'kaoyan')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skip backup if 07:30 already succeeded
        if: github.event.schedule == '20 0 18 9 *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          raw = subprocess.check_output(
              ["gh", "run", "list", "--workflow", "Chen-hour kaoyan fallback", "--event", "schedule", "--json", "databaseId,conclusion,status,createdAt", "--limit", "10"],
              text=True,
          )
          runs = json.loads(raw)
          current = os.environ.get("GITHUB_RUN_ID")
          others = [r for r in runs if str(r.get("databaseId")) != str(current)]
          ok = [
              r for r in others
              if r.get("conclusion") == "success" or r.get("status") in ("in_progress", "queued")
          ]
          if ok:
              print("morning run already exists; skip 08:20 recast", ok[0])
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
                  f.write("SKIP_BACKUP=1\n")
          else:
              print("no successful morning run; continue backup cast")
          PY
      - name: Install python-docx
        if: env.SKIP_BACKUP != '1'
        run: pip install python-docx
      - name: Chen-hour Liu Yao
        if: env.SKIP_BACKUP != '1'
        run: node tools/chen-hour-kaoyan-run.js
      - name: Word
        if: env.SKIP_BACKUP != '1'
        run: python tools/write-kaoyan-docx.py
      - uses: actions/upload-artifact@v4
        if: env.SKIP_BACKUP != '1'
        with:
          name: ZhangSenjie-20260918-ChenHour-Kaoyan
          path: out/ZhangSenjie-20260918-ChenHour-Kaoyan.*
          if-no-files-found: error
